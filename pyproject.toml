[project]
name = "estudios-viales"
version = "0.1.0"
description = "Plataforma abierta de estudios viales: levantamiento, normalización, cálculo y memoria."
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.162.4",
    "uvicorn==0.54.0",
    "jinja2==3.1.6",
    "pandas==2.3.3",
    "geopandas==1.1.2",
    "pyogrio==0.12.1",
]

[project.optional-dependencies]
pruebas = ["pytest==9.2.0", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
